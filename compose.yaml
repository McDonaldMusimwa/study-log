# Study Log running locally: the API (with its SQLite database in a volume) and the web app.
#   docker compose up -d --build   then open http://localhost:8090
# Settings come from .env (see .env.example). Production runs on Netlify instead (netlify.toml).
name: study-log

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: file:/data/study-log.db
      APP_PASSWORD: ${APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-McDonaldMusimwa/Aitrainer}
    volumes:
      - data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8090:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
