# Study Log: PostgreSQL, the API and the web app.
#   docker compose up -d --build   then open http://localhost:8090
# Settings come from .env (see .env.example).
name: study-log

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study}
      POSTGRES_DB: ${POSTGRES_DB:-study_log}
    # 5433 on the host so it doesn't clash with another local Postgres (AI Trainer's, for one).
    ports: ['5433:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD:-study}@db:5432/${POSTGRES_DB:-study_log}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-McDonaldMusimwa/Aitrainer}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8090:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
